<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GALAXY CAT WARS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030611;color:#dff7ff;font-family:Arial,"Noto Sans JP",sans-serif}
body{display:flex;align-items:center;justify-content:center;touch-action:none}
#wrap{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);max-width:100vw;max-height:100vh;background:#050b18;overflow:hidden;box-shadow:0 0 40px #000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:none;pointer-events:auto}
.screen.active{display:block}
.panel{background:rgba(5,13,30,.86);border:2px solid #5de8ff;border-radius:12px;box-shadow:0 0 12px rgba(55,220,255,.3),inset 0 0 18px rgba(50,150,255,.08)}
.btn{border:2px solid #64eaff;border-radius:10px;background:rgba(8,28,53,.92);color:#e9fbff;font-weight:800;letter-spacing:.04em;min-height:48px;padding:8px 12px;font-size:16px;box-shadow:0 0 8px rgba(70,220,255,.25);touch-action:manipulation}
.btn:active{transform:scale(.97);background:#123d5b}.btn:disabled{opacity:.32;filter:grayscale(1)}
.title{position:absolute;top:55px;left:10px;right:10px;text-align:center;font-size:31px;font-weight:900;letter-spacing:.06em;text-shadow:0 0 12px #43dfff}
.subtitle{position:absolute;top:100px;left:0;right:0;text-align:center;font-size:11px;color:#9ec5d8}
#titleButtons{position:absolute;left:13%;right:13%;bottom:54px;display:flex;flex-direction:column;gap:16px}
#titleButtons .btn{font-size:18px;min-height:54px}
#prepScreen,#strategyScreen{overflow:auto;padding:10px 10px 12px}
.topbar{position:relative;margin-bottom:8px;padding:8px}.coinLabel{font-size:12px;color:#8eb5c8;letter-spacing:.12em}.coinValue{font-size:28px;font-weight:900;color:#ffe66d;text-shadow:0 0 10px rgba(255,220,70,.45)}.stageLabel{font-size:14px;color:#bcefff;margin-top:2px}
.unitCard{margin:8px 0;padding:9px}.unitHead{display:flex;align-items:center;justify-content:space-between;gap:6px}.unitName{font-weight:900;font-size:16px}.unitCost{font-size:11px;color:#a6c7d5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.stat{background:rgba(255,255,255,.035);border-radius:7px;padding:5px;font-size:11px;text-align:center}.stat b{display:block;font-size:14px;color:#fff}.upgradeGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.up{min-height:42px;padding:5px;font-size:11px}.up span{display:block;color:#7facc0;font-size:10px}.up strong{display:block;font-size:12px}.weaponTitle{font-size:11px;color:#86b8c8;margin:5px 0 3px}.toast{position:absolute;left:15%;right:15%;top:44%;text-align:center;padding:9px;border-radius:9px;background:rgba(3,10,20,.92);border:1px solid #77edff;color:#fff;z-index:20;opacity:0;transform:translateY(8px);transition:.15s}.toast.show{opacity:1;transform:none}
#strategyScreen{padding-bottom:78px}.costBox{display:grid;grid-template-columns:1fr 1fr;gap:7px}.costCell{text-align:center;padding:6px}.costCell small{display:block;color:#8db1c1;font-size:10px}.costCell b{font-size:23px;color:#fff}.over b{color:#ff7380}.rows{margin-top:8px}.unitRow{display:grid;grid-template-columns:1fr 52px 48px;align-items:center;gap:6px;padding:6px 8px;margin:5px 0;min-height:50px}.unitRow .name{font-weight:800;font-size:14px}.count{font-weight:900;text-align:center;font-size:18px}.minus{min-height:40px;padding:2px;font-size:20px}.sectionTitle{font-size:12px;letter-spacing:.15em;color:#8fb8c9;margin:9px 2px 5px}.choices{display:grid;gap:6px}.routeChoices{grid-template-columns:repeat(3,1fr)}.tacticsChoices{grid-template-columns:1fr 1fr}.choice{min-height:44px;font-size:12px}.choice.selected{border-color:#fff;background:rgba(30,110,150,.75);box-shadow:0 0 14px rgba(100,240,255,.65),inset 0 0 12px rgba(255,255,255,.12)}
.bottomBtns{position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));width:min(94%,520px);display:grid;grid-template-columns:1fr 1fr;gap:7px;z-index:8}.bottomBtns .btn{font-size:12px;min-height:48px}
#battleOverlay{position:absolute;inset:0;pointer-events:none}.battleHud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}.hudBox{padding:5px 8px;font-size:11px;background:rgba(2,9,20,.68);border:1px solid rgba(105,225,255,.55);border-radius:7px}.hudBox b{color:#fff;font-size:13px}.battleMsg{position:absolute;top:45%;left:0;right:0;text-align:center;font-weight:900;font-size:34px;text-shadow:0 0 15px #4df3ff;opacity:0;transition:.25s}.battleMsg.show{opacity:1}.swipeHint{position:absolute;bottom:10px;left:10px;color:rgba(200,240,255,.45);font-size:10px}
#titleCat{position:absolute;left:50%;top:29%;transform:translate(-50%,-50%);width:145px;height:145px}
.endPanel{position:absolute;left:8%;right:8%;top:26%;padding:18px;text-align:center}.endPanel h2{font-size:30px;margin:0 0 12px;color:#fff;text-shadow:0 0 14px #53eaff}.reward{font-size:26px;color:#ffe66d;font-weight:900;margin:12px 0}
@media(max-height:600px){.title{top:28px;font-size:25px}.subtitle{top:68px}#titleCat{top:28%;width:120px;height:120px}#titleButtons{bottom:22px;gap:9px}.btn{min-height:42px}.unitCard{margin:5px 0;padding:7px}.up{min-height:36px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="ui">
<section id="titleScreen" class="screen active">
<div class="title">GALAXY CAT WARS</div><div class="subtitle">CAT UNITED SPACE DEFENSE</div><div id="titleCat"></div>
<div id="titleButtons"><button id="startBtn" class="btn">GAME START</button><button id="continueBtn" class="btn">CONTINUE</button></div>
</section>
<section id="prepScreen" class="screen"></section>
<section id="strategyScreen" class="screen"></section>
<div id="battleOverlay" class="screen"><div class="battleHud"><div id="battleStage" class="hudBox"></div><div id="battleCost" class="hudBox"></div></div><div id="battleMsg" class="battleMsg"></div><div class="swipeHint">SWIPE：カメラ移動</div></div>
<section id="resultScreen" class="screen"><div class="endPanel panel"><h2 id="resultTitle"></h2><div id="resultText"></div><div id="reward" class="reward"></div><button id="resultBtn" class="btn">NEXT</button></div></section>
<section id="endingScreen" class="screen"><div class="endPanel panel"><h2>GALAXY CAT WARS</h2><div id="endingText"></div><button id="endingBtn" class="btn">TITLE</button></div></section>
<div id="toast" class="toast"></div>
</div></div>
<script>
'use strict';
const W=360,H=640,canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let dpr=1,scale=1,ox=0,oy=0,last=0,raf=0,state='TITLE',stage=1,coin=5000,maxCost=30;
const STORAGE='galaxy_cat_wars_save_v1';
const weaponPower={laser:[15,20,25,30,35,40],superLaser:[50,55,60,65,70,75],railgun:[25,30,35,40,45,50]};
const weaponMax={laser:5,superLaser:5,railgun:5};
const weaponCost={Fighter:{laser:400,railgun:400},SuperFighter:{laser:400,railgun:400},Battleship:{superLaser:800,laser:400,railgun:800},GiantBattleship:{superLaser:800,railgun:800}};
const unitDef={
 Fighter:{name:'Fighter',jp:'戦闘機',cost:2,hp:10,sp:5,armor:5,ammo:{laser:50,railgun:10},incs:{hp:3,sp:1,armor:2}},
 SuperFighter:{name:'Super Fighter',jp:'スーパー戦闘機',cost:3,hp:15,sp:7,armor:8,ammo:{laser:50,railgun:20},incs:{hp:3,sp:1,armor:2}},
 Battleship:{name:'Battleship',jp:'戦艦',cost:10,hp:100,sp:2,armor:20,ammo:{superLaser:30,laser:300,railgun:50},incs:{hp:20,sp:1,armor:5}},
 GiantBattleship:{name:'Giant Battleship',jp:'巨大戦艦',cost:20,hp:300,sp:1,armor:40,ammo:{superLaser:60,railgun:100},incs:{hp:50,sp:1,armor:5}}
};
const unitKeys=Object.keys(unitDef);
const stageDef={
 1:{name:'Mars Army',enemy:'octopus',planet:'mars',enemyLevel:1,enemies:{Fighter:6,Battleship:1},obstacles:0},
 2:{name:'Saturn Army',enemy:'monkey',planet:'saturn',enemyLevel:1,enemies:{Fighter:6,SuperFighter:4,Battleship:2},obstacles:2},
 3:{name:'Jupiter Army',enemy:'alien',planet:'jupiter',enemyLevel:2,enemies:{Fighter:8,SuperFighter:6,Battleship:2,GiantBattleship:1},obstacles:2},
 4:{name:'Sun Army',enemy:'fairy',planet:'sun',enemyLevel:2,enemies:{SuperFighter:10,Battleship:1,GiantBattleship:1},obstacles:0},
 5:{name:'Moon Army',enemy:'rabbit',planet:'moon',enemyLevel:3,enemies:{Fighter:10,SuperFighter:8,Battleship:3,GiantBattleship:1},obstacles:12}
};
const upgrades={};
for(const k of unitKeys) upgrades[k]={hp:0,sp:0,armor:0,laser:0,superLaser:0,railgun:0};
let selected={Fighter:0,SuperFighter:0,Battleship:0,GiantBattleship:0},route='center',tactics='fighter';
let units=[],projectiles=[],explosions=[],obstacles=[],meteors=[],prominences=[],particles=[];let cameraX=0,cameraY=320,battleTime=0,stageIntro=0,battleResult=null,lastStallCheck=0,stallTimer=0;let cameraAuto=true,cameraManualTimer=0;
let audio=null,bgmTimer=null,ambientTimer=null,finalStage=false;
let battleSession=0,battleResultTimer=0,battleMessageTimer=0;
const stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.2,a:.25+Math.random()*.7,s:.3+Math.random()*1.2}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width='100%';canvas.style.height='100%';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function setState(s){state=s;document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));const id={TITLE:'titleScreen',PREPARATION:'prepScreen',STRATEGY:'strategyScreen',BATTLE:'battleOverlay',VICTORY:'resultScreen',DEFEAT:'resultScreen',ENDING:'endingScreen'}[s];if(id)document.getElementById(id).classList.add('active');if(s==='PREPARATION')renderPrep();if(s==='STRATEGY')renderStrategy();if(s==='TITLE')renderTitle();if(s==='BATTLE')renderBattleHud();}
function renderTitle(){const has=!!loadSave(true);document.getElementById('continueBtn').disabled=!has;drawTitleCat()}
function drawTitleCat(){const el=document.getElementById('titleCat');el.innerHTML='<svg viewBox="0 0 160 160" width="100%" height="100%"><defs><radialGradient id="cg"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#8ea5bb"/></radialGradient></defs><path d="M32 61 L24 25 L55 43 Q80 28 105 43 L136 25 L128 62 Q142 82 132 111 Q121 140 80 143 Q39 140 28 111 Q18 82 32 61" fill="url(#cg)" stroke="#67e8ff" stroke-width="4"/><circle cx="57" cy="76" r="8" fill="#17314a"/><circle cx="103" cy="76" r="8" fill="#17314a"/><circle cx="59" cy="74" r="2" fill="white"/><circle cx="105" cy="74" r="2" fill="white"/><path d="M74 91 Q80 97 86 91" fill="none" stroke="#17314a" stroke-width="4"/><path d="M41 99 L15 92 M41 105 L15 108 M119 99 L145 92 M119 105 L145 108" stroke="#ccefff" stroke-width="3"/><path d="M52 113 Q80 125 108 113 L101 137 Q80 149 59 137Z" fill="#2f6588" stroke="#68eaff" stroke-width="3"/><path d="M64 112 L64 141 M96 112 L96 141" stroke="#a9efff" stroke-width="3"/></svg>'}
function baseSave(){return {stage:1,coin:5000,maxCost:30,upgrades:JSON.parse(JSON.stringify(upgrades))}}
function loadSave(checkOnly=false){try{const raw=localStorage.getItem(STORAGE);if(!raw)return null;const s=JSON.parse(raw);if(checkOnly)return s;stage=Math.max(1,Math.min(5,s.stage||1));coin=Math.max(0,s.coin||0);maxCost=Math.max(30,s.maxCost||30);Object.assign(upgrades,s.upgrades||{});return s}catch(e){return null}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({stage,coin,maxCost,upgrades}))}catch(e){}}
function newGame(){const s=baseSave();stage=s.stage;coin=s.coin;maxCost=s.maxCost;for(const k of unitKeys)Object.assign(upgrades[k],s.upgrades[k]);selected={Fighter:0,SuperFighter:0,Battleship:0,GiantBattleship:0};route='center';tactics='fighter';save();setState('PREPARATION');audioStart()}
function continueGame(){if(!loadSave())return;selected={Fighter:0,SuperFighter:0,Battleship:0,GiantBattleship:0};route='center';tactics='fighter';setState('PREPARATION');audioStart()}
function money(n){return Math.max(0,Math.floor(n)).toLocaleString('ja-JP')}
function getStat(k,p){const d=unitDef[k],u=upgrades[k];if(p==='hp')return d.hp+u.hp*d.incs.hp;if(p==='sp')return d.sp+u.sp*d.incs.sp;if(p==='armor')return d.armor+u.armor*d.incs.armor;return d[p]}
function upCost(k,p){return weaponCost[k]?.[p] ?? ({Fighter:{hp:300,sp:200,armor:200},SuperFighter:{hp:300,sp:200,armor:200},Battleship:{hp:2000,sp:500,armor:500},GiantBattleship:{hp:3000,sp:500,armor:500}}[k]?.[p]||0)}
function maxLv(p){return weaponMax[p]||5}
function doUpgrade(k,p){const u=upgrades[k],lv=u[p]||0,limit=(p==='hp'||p==='sp'||p==='armor')?5:maxLv(p);if(lv>=limit){toast('最大Lvです');return}const c=upCost(k,p);if(coin<c){toast('COINが不足しています');return}coin-=c;u[p]=lv+1;save();sfx('upgrade');renderPrep();toast('-'+money(c)+' COIN / Lv'+(lv+2))}
function renderPrep(){const el=document.getElementById('prepScreen');let h='<div class="panel topbar"><div class="coinLabel">COIN</div><div class="coinValue">'+money(coin)+'</div><div class="stageLabel">STAGE '+stage+' / '+stageDef[stage].name+'</div></div>';for(const k of unitKeys){const d=unitDef[k],u=upgrades[k];h+='<div class="panel unitCard"><div class="unitHead"><div class="unitName">'+d.jp+'</div><div class="unitCost">COST '+d.cost+'</div></div><div class="stats"><div class="stat">HP<b>'+getStat(k,'hp')+' <small>Lv'+(u.hp+1)+'</small></b></div><div class="stat">SP<b>'+getStat(k,'sp')+' <small>Lv'+(u.sp+1)+'</small></b></div><div class="stat">装甲<b>'+getStat(k,'armor')+' <small>Lv'+(u.armor+1)+'</small></b></div></div><div class="upgradeGrid">';for(const p of ['hp','sp','armor']){const lv=u[p],lim=5,c=upCost(k,p);h+='<button class="btn up" '+((lv>=lim||coin<c)?'disabled':'')+' data-up="'+k+'|'+p+'"><span>'+p.toUpperCase()+' +'+d.incs[p]+'</span><strong>Lv '+(lv+1)+' / '+(lim+1)+'　'+money(c)+' COIN</strong></button>'}h+='</div><div class="weaponTitle">WEAPONS</div><div class="upgradeGrid">';for(const p of Object.keys(d.ammo)){const lv=u[p],lim=maxLv(p),c=upCost(k,p),pow=weaponPower[p][lv];h+='<button class="btn up" '+((lv>=lim||coin<c)?'disabled':'')+' data-up="'+k+'|'+p+'"><span>'+weaponName(p)+' / 威力 '+pow+'</span><strong>Lv '+(lv+1)+' / '+(lim+1)+'　'+money(c)+' COIN</strong></button>'}h+='</div></div>'}h+='<div style="height:62px"></div><div class="bottomBtns"><button class="btn" id="toStrategy">STRATEGY</button></div>';el.innerHTML=h;el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const [k,p]=b.dataset.up.split('|');doUpgrade(k,p)});el.querySelector('#toStrategy').onclick=()=>setState('STRATEGY')}
function weaponName(p){return p==='laser'?'LASER':p==='superLaser'?'SUPER LASER':'RAILGUN'}
function totalCost(){return unitKeys.reduce((a,k)=>a+selected[k]*unitDef[k].cost,0)}
function renderStrategy(){const el=document.getElementById('strategyScreen');let h='<div class="panel topbar"><div class="costBox"><div class="costCell"><small>TOTAL COST</small><b>'+maxCost+'</b></div><div class="costCell '+(totalCost()>maxCost?'over':'')+'"><small>USE COST</small><b>'+totalCost()+'</b></div></div><div class="stageLabel">STAGE '+stage+' / '+stageDef[stage].name+'</div></div><div class="rows">';for(const k of unitKeys)h+='<div class="panel unitRow"><div class="name">'+unitDef[k].jp+'</div><div class="count">×'+selected[k]+'</div><button class="btn minus" data-minus="'+k+'">✕</button></div>';h+='</div><div class="sectionTitle">ROUTE</div><div class="choices routeChoices">';for(const r of [['top','上部'],['center','中央'],['bottom','下部']])h+='<button class="btn choice '+(route===r[0]?'selected':'')+'" data-route="'+r[0]+'">'+r[1]+'</button>';h+='</div><div class="sectionTitle">TACTICS</div><div class="choices tacticsChoices">';for(const t of [['fighter','戦闘機中心'],['ship','戦艦中心']])h+='<button class="btn choice '+(tactics===t[0]?'selected':'')+'" data-tactics="'+t[0]+'">'+t[1]+'</button>';h+='</div><div class="bottomBtns"><button class="btn" id="battleStart">BATTLE START</button><button class="btn" id="backPrep">BACK TO PREPARATION</button></div>';el.innerHTML=h;for(const k of unitKeys){el.querySelector('[data-minus="'+k+'"]').onclick=()=>{selected[k]=Math.max(0,selected[k]-1);sfx('button');renderStrategy()};el.querySelectorAll('.unitRow').forEach((row,i)=>{row.querySelector('.name').onclick=()=>{const kk=unitKeys[i],cost=unitDef[kk].cost;if(totalCost()+cost<=maxCost){selected[kk]++;sfx('button');renderStrategy()}else toast('最大コストを超えています')}})}el.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;sfx('button');renderStrategy()});el.querySelectorAll('[data-tactics]').forEach(b=>b.onclick=()=>{tactics=b.dataset.tactics;sfx('button');renderStrategy()});el.querySelector('#backPrep').onclick=()=>setState('PREPARATION');el.querySelector('#battleStart').onclick=startBattle}
function startBattle(){if(totalCost()>maxCost)return toast('使用コストが最大コストを超えています');if(totalCost()<=0)return toast('1機以上選択してください');if(!route||!tactics)return toast('ROUTEとTACTICSを選択してください');audioStart();initBattle();setState('BATTLE');showBattleMessage('STAGE '+stage,1.2)}
function initBattle(){
  battleSession++;
  if(battleResultTimer){clearTimeout(battleResultTimer);battleResultTimer=0}
  if(battleMessageTimer){clearTimeout(battleMessageTimer);battleMessageTimer=0}
  units=[];projectiles=[];explosions=[];obstacles=[];meteors=[];prominences=[];particles=[];
  cameraAuto=true;cameraManualTimer=0;
  cameraX=0;cameraY=route==='top'?100:route==='bottom'?540:320;
  battleTime=0;stageIntro=2.0;battleResult=null;stallTimer=0;lastStallCheck=0;finalStage=false;const yBase=route==='top'?270:route==='bottom'?730:500;for(const k of unitKeys){for(let i=0;i<selected[k];i++)spawnUnit(k,'player',40+Math.random()*120,yBase+(i-(selected[k]-1)/2)*55)}}
function spawnEnemy(){const def=stageDef[stage];for(const k of unitKeys){for(let i=0;i<def.enemies[k]||0;i++)spawnUnit(k,'enemy',820+Math.random()*180,180+(i%8)*110)}}
function spawnUnit(type,team,x,y){const lv=team==='enemy'?stageDef[stage].enemyLevel:0;const d=unitDef[type],u=upgrades[type];const scaleLv=team==='enemy'?lv:0;const stats={hp:getStat(type,'hp')+scaleLv*((d.incs.hp)*2),sp:getStat(type,'sp')+scaleLv,armor:getStat(type,'armor')+scaleLv*2};const ammo={};for(const p in d.ammo)ammo[p]=d.ammo[p];units.push({id:Math.random().toString(36).slice(2),type,team,x,y,vx:0,vy:0,stats,maxHp:stats.hp,ammo,ammoMax:{...ammo},reload:{},target:null,alive:true,age:Math.random()*2,stall:0,lastX:x,lastY:y,shotClock:Math.random()*.8,hitClock:0})}
function worldClamp(u){u.x=Math.max(20,Math.min(1060,u.x));u.y=Math.max(35,Math.min(1245,u.y))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function radius(u){return u.type==='GiantBattleship'?34:u.type==='Battleship'?25:u.type==='SuperFighter'?17:12}
function findTarget(u){let best=null,bd=1e9;for(const v of units)if(v.alive&&v.team!==u.team){const dd=dist(u,v);if(dd<bd){bd=dd;best=v}}return best}
function weaponRange(p){return p==='railgun'?190:p==='superLaser'?430:320}
function pickWeapon(u,t){const near=dist(u,t);const available=p=>u.ammo[p]>0; if(u.type==='Fighter'||u.type==='SuperFighter')return near<weaponRange('railgun')&&available('railgun')?'railgun':available('laser')?'laser':available('railgun')?'railgun':null; if(u.type==='Battleship')return available('laser')?'laser':available('superLaser')?'superLaser':available('railgun')?'railgun':null;return available('superLaser')?'superLaser':near<weaponRange('railgun')&&available('railgun')?'railgun':null}
function reloadWeapon(u,p){if(!u.reload[p])u.reload[p]=1.4;u.reload[p]-=DT;if(u.reload[p]<=0){u.ammo[p]=u.ammoMax[p];u.reload[p]=0}}
let DT=.016;
function updateBattle(dt){if(battleResult)return;DT=Math.min(Math.max(dt,0),.05);battleTime+=DT;if(battleTime>=180){finishBattle(false);return;}if(cameraManualTimer>0){cameraManualTimer-=dt;if(cameraManualTimer<=0)cameraAuto=true;}if(stageIntro>0){stageIntro-=DT;if(stageIntro<=0){spawnEnemy();showBattleMessage('BATTLE START',1.0);sfx('stage')}}updateEnvironment(DT);updateObstacles(DT);for(const u of units)if(u.alive)updateUnit(u,DT);updateProjectiles(DT);updateExplosions(DT);updateParticles(DT);cameraFollow();checkBattleEnd()}
function updateUnit(u,dt){u.age+=dt;u.shotClock=Math.max(0,u.shotClock-dt);for(const p in u.ammo)if(u.ammo[p]<=0)reloadWeapon(u,p);const enemy=findTarget(u);u.target=enemy;if(!enemy)return;let dx=enemy.x-u.x,dy=enemy.y-u.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;let sepX=0,sepY=0;for(const v of units)if(v!==u&&v.alive){const dd=dist(u,v),minD=radius(u)+radius(v)+8;if(dd<minD&&dd>0){const f=(minD-dd)/minD;sepX+=(u.x-v.x)/dd*f;sepY+=(u.y-v.y)/dd*f}}for(const o of obstacles){const dd=Math.hypot(u.x-o.x,u.y-o.y),safe=radius(u)+o.r+30;if(dd<safe){const ax=(u.x-o.x)/(dd||1),ay=(u.y-o.y)/(dd||1);sepX+=ax*(safe-dd)/safe*2;sepY+=ay*(safe-dd)/safe*2}}let range=typeRange(u.type), desired=range*.72;let move=0;if(d>desired)move=1;else if(d<desired*.55)move=-.65;let tx=nx*move+sepX*1.7,ty=ny*move+sepY*1.7;if(u.team==='player'&&route==='top')ty+=.15;if(u.team==='player'&&route==='bottom')ty-=.15;const m=Math.hypot(tx,ty)||1;const speed=(u.stats.sp*15)*(u.type==='GiantBattleship'?.55:1);u.vx+=(tx/m*speed-u.vx)*Math.min(1,dt*4);u.vy+=(ty/m*speed-u.vy)*Math.min(1,dt*4);u.x+=u.vx*dt;u.y+=u.vy*dt;worldClamp(u);if(Math.hypot(u.vx,u.vy)<3)u.stall+=dt;else u.stall=0;if(u.stall>.8){u.vy+=(Math.random()<.5?-1:1)*35;u.vx+=u.team==='player'?12:-12;u.stall=0}if(d<=weaponRange(pickWeapon(u,enemy)||'laser')*.92)shoot(u,enemy);environmentDamage(u,dt)}
function typeRange(t){return t==='Fighter'?250:t==='SuperFighter'?280:t==='Battleship'?380:430}
function shoot(u,t){if(!t||!t.alive||u.shotClock>0)return;const p=pickWeapon(u,t);if(!p)return;u.shotClock=p==='superLaser'?.9:p==='railgun'?.7:.38;u.ammo[p]--;const wlv=Math.max(0,Math.min((weaponPower[p]?.length||1)-1,upgrades[u.type]?.[p]||0));const power=weaponPower[p]?.[wlv]??weaponPower[p]?.[0]??1;const dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy)||1;projectiles.push({x:u.x,y:u.y,vx:dx/d*420,vy:dy/d*420,team:u.team,weapon:p,power,life:1.8,r:p==='superLaser'?5:p==='railgun'?4:2.5});sfx(p);}
function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let hit=false;for(const u of units)if(u.alive&&u.team!==p.team&&Math.hypot(u.x-p.x,u.y-p.y)<radius(u)+p.r){damage(u,p.power,p.weapon);hit=true;break}if(hit||p.life<=0||p.x<0||p.x>1080||p.y<0||p.y>1280)projectiles.splice(i,1)}}
function damage(u,power,weapon){if(!u.alive)return;const dmg=Math.max(1,power-u.stats.armor);u.stats.hp-=dmg;if(u.stats.hp<=0){u.stats.hp=0;destroyUnit(u)} }
function destroyUnit(u){if(!u.alive)return;u.alive=false;const size=u.type==='Fighter'?18:u.type==='SuperFighter'?28:u.type==='Battleship'?48:70;explosions.push({x:u.x,y:u.y,r:2,max:size,t:0,dur:u.type==='GiantBattleship'?1.1:.65,team:u.team});for(let i=0;i<(size/2);i++)particles.push({x:u.x,y:u.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,t:0,d:.45+Math.random()*.5,r:1+Math.random()*3});sfx(u.type==='Fighter'?'boom1':u.type==='SuperFighter'?'boom2':u.type==='Battleship'?'boom3':'boom4')}
function updateExplosions(dt){for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.t+=dt;e.r=e.max*(e.t/e.dur);if(e.t>e.dur)explosions.splice(i,1)}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.t>p.d)particles.splice(i,1)}}
function updateEnvironment(dt){if(stage!==4)return;if(!prominences.length)for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2;const rr=125+Math.random()*95;prominences.push({x:cameraX+300+Math.cos(a)*rr,y:cameraY+180+Math.sin(a)*rr*.72,r:3,maxR:13,t:Math.random()*2.6,hit:0});}for(const p of prominences){p.t+=dt;p.hit-=dt;const phase=p.t%2.6;p.r=phase<1.3?p.r=3+(p.maxR-3)*(phase/1.3):p.maxR-(p.maxR-3)*((phase-1.3)/1.3);for(const u of units)if(u.alive&&Math.hypot(u.x-p.x,u.y-p.y)<radius(u)+p.r){if(p.hit<=0){damage(u,18,'environment');p.hit=.7}}}}
function environmentDamage(u,dt){u.hitClock-=dt}
function cameraFollow(){if(!cameraAuto)return;const alive=units.filter(u=>u.alive&&u.team==='player');if(alive.length){const cx=alive.reduce((a,u)=>a+u.x,0)/alive.length,cy=alive.reduce((a,u)=>a+u.y,0)/alive.length;cameraX+=(Math.max(0,Math.min(720,cx-180))-cameraX)*.08;cameraY+=(Math.max(0,Math.min(640,cy-320))-cameraY)*.08}}
function checkBattleEnd(){if(stageIntro>0||!units.some(u=>u.team==='enemy'))return;const p=units.filter(u=>u.team==='player'&&u.alive),e=units.filter(u=>u.team==='enemy'&&u.alive);const eBig=e.filter(u=>u.type==='Battleship'||u.type==='GiantBattleship');const pBig=p.filter(u=>u.type==='Battleship'||u.type==='GiantBattleship');const eWinCondition=eBig.length?eBig.length===0:e.length===0;const pWinCondition=pBig.length?pBig.length===0:p.length===0;if(!e.length||eWinCondition){finishBattle(true);return}if(!p.length||pWinCondition){finishBattle(false);return}if(battleTime-lastStallCheck>3){lastStallCheck=battleTime;const near=units.filter(u=>u.alive&&u.target&&dist(u,u.target)<500);if(!near.length)for(const u of units)if(u.alive&&u.target){u.x+=(u.target.x-u.x)*.08;u.y+=(u.target.y-u.y)*.08}}}
function finishBattle(win){if(battleResult)return;const session=battleSession;battleResult=win?'win':'lose';finalStage=win&&stage===5;const enemyDestroyed=stageDef[stage].enemies;let reward=0;if(win){for(const k of unitKeys)reward+=(enemyDestroyed[k]||0)*unitDef[k].cost*300;coin+=reward;maxCost=Math.min(70,maxCost+10);save()}else save();if(battleResultTimer)clearTimeout(battleResultTimer);battleResultTimer=setTimeout(()=>{battleResultTimer=0;if(session!==battleSession)return;showResult(win,reward)},700);}
function showResult(win,reward){setState(win?'VICTORY':'DEFEAT');document.getElementById('resultTitle').textContent=win?'VICTORY':'DEFEAT';document.getElementById('resultText').textContent=win?'STAGE '+(finalStage?5:stage-1)+' CLEAR':'艦隊が全滅しました。';document.getElementById('reward').textContent=win?'獲得COIN +'+money(reward):'COINは失われません';document.getElementById('resultBtn').textContent=win?(finalStage?'ENDING':'NEXT STAGE'):'RETRY';sfx(win?'victory':'defeat')}
function showBattleMessage(t,d){const e=document.getElementById('battleMsg');if(battleMessageTimer){clearTimeout(battleMessageTimer);battleMessageTimer=0}e.textContent=t;e.classList.add('show');battleMessageTimer=setTimeout(()=>{battleMessageTimer=0;e.classList.remove('show')},d*1000)}
function renderBattleHud(){document.getElementById('battleStage').innerHTML='STAGE '+stage+' / '+stageDef[stage].name;document.getElementById('battleCost').innerHTML='COST '+totalCost()+' / '+maxCost}
function draw(){ctx.clearRect(0,0,W,H);drawSpace();if(state==='BATTLE')drawBattle();else if(state==='TITLE'){}else if(state==='VICTORY'||state==='DEFEAT'||state==='ENDING')drawSpace();}
function drawSpace(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020612');g.addColorStop(1,'#071426');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){s.y+=s.s*.015;if(s.y>H)s.y=0;ctx.globalAlpha=s.a;ctx.fillStyle='#d9f5ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(state==='TITLE'){ctx.fillStyle='rgba(35,100,150,.12)';ctx.beginPath();ctx.arc(280,205,90,0,Math.PI*2);ctx.fill();}}
function worldToScreen(x,y){return{x:x-cameraX,y:y-cameraY}}
function drawBattle(){drawPlanet();for(const o of obstacles){const s=worldToScreen(o.x,o.y);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(o.angle);ctx.fillStyle='#687785';ctx.strokeStyle='#9eb3c0';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<o.points.length;i++){const pt=o.points[i];if(i===0)ctx.moveTo(pt.x,pt.y);else ctx.lineTo(pt.x,pt.y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}for(const p of prominences){const s=worldToScreen(p.x,p.y);const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,p.r);g.addColorStop(0,'#fff36a');g.addColorStop(.45,'#ffd22f');g.addColorStop(1,'#e53920');ctx.fillStyle=g;ctx.shadowBlur=10;ctx.shadowColor='#ff5a24';ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const m of meteors){const s=worldToScreen(m.x,m.y);ctx.strokeStyle='#fff2c5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x-s.vx*.04,s.y-s.vy*.04);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.lineWidth=1}for(const p of projectiles){const s=worldToScreen(p.x,p.y);ctx.strokeStyle=p.weapon==='railgun'?'#ffb5df':'#b9efff';ctx.shadowBlur=8;ctx.shadowColor=ctx.strokeStyle;ctx.lineWidth=p.r;ctx.beginPath();ctx.moveTo(s.x-p.vx*.025,s.y-p.vy*.025);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.shadowBlur=0}for(const u of units)if(u.alive)drawUnit(u);for(const e of explosions){const s=worldToScreen(e.x,e.y);const a=1-e.t/e.dur;ctx.globalAlpha=a;ctx.fillStyle='#ffd36b';ctx.shadowBlur=18;ctx.shadowColor='#ff7b36';ctx.beginPath();ctx.arc(s.x,s.y,e.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}for(const p of particles){const s=worldToScreen(p.x,p.y);ctx.globalAlpha=Math.max(0,1-p.t/p.d);ctx.fillStyle='#d9f8ff';ctx.fillRect(s.x,s.y,p.r,p.r)}ctx.globalAlpha=1}
function drawPlanet(){const p=stageDef[stage].planet;let x=300,y=340,r=105;if(p==='mars'){x=310;y=150;r=90;ctx.fillStyle='#8c3f3f';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b45a4d';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(x-55+Math.random()*110,y-55+Math.random()*110,4+Math.random()*9,0,Math.PI*2);ctx.fill()}}else if(p==='saturn'){x=300;y=170;r=75;ctx.strokeStyle='rgba(220,210,160,.6)';ctx.lineWidth=14;ctx.beginPath();ctx.ellipse(x,y,125,30,-.12,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#c9a968';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}else if(p==='jupiter'){x=300;y=150;r=100;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();const gg=ctx.createLinearGradient(0,y-r,0,y+r);gg.addColorStop(0,'#9f785c');gg.addColorStop(.3,'#d0aa82');gg.addColorStop(.55,'#8f6955');gg.addColorStop(.8,'#d3ae8a');ctx.fillStyle=gg;ctx.fillRect(x-r,y-r,2*r,2*r);for(let yy=y-r;yy<y+r;yy+=18){ctx.fillStyle=yy%36<18?'rgba(80,50,40,.2)':'rgba(255,235,205,.12)';ctx.fillRect(x-r,yy,2*r,8)}ctx.restore();ctx.fillStyle='rgba(180,90,65,.7)';ctx.beginPath();ctx.ellipse(x+32,y+25,22,12,0,0,Math.PI*2);ctx.fill()}else if(p==='sun'){x=300;y=180;r=115;const g=ctx.createRadialGradient(x,y,10,x,y,r);g.addColorStop(0,'#fffbd0');g.addColorStop(.55,'#ffd84e');g.addColorStop(1,'#ff733c');ctx.fillStyle=g;ctx.shadowBlur=30;ctx.shadowColor='#ff9a3d';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}else{x=300;y=150;r=90;ctx.fillStyle='#aab2c1';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7f8796';for(let i=0;i<14;i++){ctx.beginPath();ctx.arc(x-65+Math.random()*130,y-65+Math.random()*130,3+Math.random()*7,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#5e83a5';ctx.beginPath();ctx.arc(265,125,16,0,Math.PI*2);ctx.fill()}}
function drawUnit(u){const s=worldToScreen(u.x,u.y),r=radius(u);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(u.vy,u.vx)*.12);let grad=ctx.createLinearGradient(-r,-r,r,r);if(u.team==='player'){grad.addColorStop(0,u.type==='SuperFighter'||u.type==='GiantBattleship'?'#fff5a0':'#e9f3f8');grad.addColorStop(1,'#7892a4')}else{grad.addColorStop(0,u.type==='SuperFighter'||u.type==='GiantBattleship'?'#d8ffd0':'#ffd2d2');grad.addColorStop(1,'#9e5f69')}ctx.fillStyle=grad;ctx.strokeStyle=u.team==='player'?'#69eaff':'#ff788b';ctx.lineWidth=2;ctx.shadowBlur=7;ctx.shadowColor=ctx.strokeStyle;if(u.type==='Fighter'){ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(-r*.8,-r*.7);ctx.lineTo(-r*.35,0);ctx.lineTo(-r*.8,r*.7);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#7ddfff';ctx.beginPath();ctx.arc(0,0,r*.3,0,Math.PI*2);ctx.fill()}else if(u.type==='SuperFighter'){ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(-r*.4,-r*.7);ctx.lineTo(-r*.9,-r*.95);ctx.lineTo(-r*.65,0);ctx.lineTo(-r*.9,r*.95);ctx.lineTo(-r*.4,r*.7);ctx.closePath();ctx.fill();ctx.stroke()}else{const rr=u.type==='GiantBattleship'?r:r*.82;ctx.beginPath();ctx.roundRect(-rr,-rr*.55,rr*2,rr*1.1,rr*.4);ctx.fill();ctx.stroke();ctx.fillStyle='#7feaff';ctx.beginPath();ctx.arc(rr*.35,0,rr*.22,0,Math.PI*2);ctx.fill();if(u.type==='GiantBattleship'){ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-rr*.6,-rr*.5);ctx.lineTo(-rr*1.25,-rr*.9);ctx.lineTo(-rr*.95,0);ctx.lineTo(-rr*1.25,rr*.9);ctx.lineTo(-rr*.6,rr*.5);ctx.closePath();ctx.fill();ctx.stroke()}}ctx.shadowBlur=0;ctx.restore();const hp=Math.max(0,u.stats.hp/u.maxHp),barW=r*2.2;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(s.x-barW/2,s.y-r-8,barW,3);ctx.fillStyle=u.team==='player'?'#63f0a1':'#ff6c7a';ctx.fillRect(s.x-barW/2,s.y-r-8,barW*hp,3)}
function seedBattleObjects(){obstacles=[];if(stage===2||stage===3||stage===5)for(let i=0;i<stageDef[stage].obstacles;i++){const r=13+Math.random()*12;const pts=[];const count=4;for(let j=0;j<count;j++){const a=Math.PI*.5*j;const rr=r*(.72+Math.random()*.48);pts.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr})}obstacles.push({x:260+Math.random()*650,y:100+Math.random()*1080,r,points:pts,angle:Math.random()*Math.PI*2,vx:(Math.random()<.5?-1:1)*(10+Math.random()*18),vy:(Math.random()<.5?-1:1)*(10+Math.random()*18),turn:Math.random()*.9,turnDir:Math.random()<.5?-1:1})}}
function updateObstacles(dt){for(const o of obstacles){o.turn-=dt;if(o.turn<=0){o.turn=.45+Math.random()*1.2;if(Math.random()<.65)o.vx+=(Math.random()<.5?-1:1)*(8+Math.random()*18);if(Math.random()<.65)o.vy+=(Math.random()<.5?-1:1)*(8+Math.random()*18);o.vx=Math.max(-35,Math.min(35,o.vx));o.vy=Math.max(-35,Math.min(35,o.vy));o.turnDir=Math.random()<.5?-1:1}o.angle+=o.turnDir*dt*.25;o.x+=o.vx*dt;o.y+=o.vy*dt;const minX=35,maxX=1045,minY=35,maxY=1245;if(o.x<minX){o.x=minX;o.vx=Math.abs(o.vx)}else if(o.x>maxX){o.x=maxX;o.vx=-Math.abs(o.vx)}if(o.y<minY){o.y=minY;o.vy=Math.abs(o.vy)}else if(o.y>maxY){o.y=maxY;o.vy=-Math.abs(o.vy)}}}
const oldInit=initBattle;initBattle=function(){oldInit();seedBattleObjects()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1100)}
function showEnding(){setState('ENDING');document.getElementById('endingText').innerHTML='5つの軍勢を越え、猫たちの宇宙艦隊は地球圏を守り抜いた。<br><br>GALAXY CAT WARS<br>MISSION COMPLETE';sfx('victory')}
function setupButtons(){document.getElementById('startBtn').onclick=newGame;document.getElementById('continueBtn').onclick=continueGame;document.getElementById('resultBtn').onclick=()=>{if(battleResult==='win'){if(finalStage)showEnding();else {stage=Math.min(5,stage+1);save();setState('PREPARATION')}}else setState('STRATEGY');};document.getElementById('endingBtn').onclick=()=>setState('TITLE')}
let audioReady=false;
function audioStart(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();}if(audio.state==='suspended')audio.resume();audioReady=true;if(!ambientTimer){ambientTimer=setInterval(()=>sfx('drop'),2600)}}catch(e){audioReady=false}}
function osc(freq,dur,type='sine',gain=.03,when=0){if(!audioReady||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+when);g.gain.setValueAtTime(.0001,audio.currentTime+when);g.gain.exponentialRampToValueAtTime(gain,audio.currentTime+when+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+when+dur);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+when);o.stop(audio.currentTime+when+dur+.03)}catch(e){}}
function sfx(n){if(!audioReady)return;const map={button:[420,.07,'square',.025],upgrade:[760,.12,'triangle',.035],laser:[980,.05,'sine',.018],superLaser:[520,.16,'sawtooth',.025],railgun:[180,.09,'square',.03],boom1:[90,.18,'sawtooth',.04],boom2:[70,.25,'sawtooth',.05],boom3:[50,.35,'sawtooth',.065],boom4:[35,.5,'sawtooth',.09],stage:[300,.25,'triangle',.04],victory:[660,.12,'sine',.04],defeat:[120,.35,'sawtooth',.04],drop:[900,.09,'sine',.008]};const a=map[n]||map.button;osc(a[0],a[1],a[2],a[3]);if(n==='victory'){osc(880,.12,'sine',.035,.13);osc(1100,.2,'sine',.035,.26)}}
function loop(t){const dt=Math.min(.05,(t-last||16)/1000);last=t;if(state==='BATTLE')updateBattle(dt);draw();raf=requestAnimationFrame(loop)}
setupButtons();renderTitle();requestAnimationFrame(loop);
let drag=false,lastTouchX=0,lastTouchY=0;
canvas.addEventListener('pointerdown',e=>{if(state!=='BATTLE')return;drag=true;cameraAuto=false;cameraManualTimer=2.5;lastTouchX=e.clientX;lastTouchY=e.clientY;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||state!=='BATTLE')return;const rect=canvas.getBoundingClientRect();const sx=W/rect.width,sy=H/rect.height;cameraX-=((e.clientX-lastTouchX)*sx);cameraY-=((e.clientY-lastTouchY)*sy);cameraX=Math.max(0,Math.min(720,cameraX));cameraY=Math.max(0,Math.min(640,cameraY));lastTouchX=e.clientX;lastTouchY=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
</script>
